# Weekly dependency updates, minor and patch grouped into one pull request per ecosystem. Their
# commit subjects are Conventional Commits (chore(deps):), so they pass pr.yml and stay out of the
# changelog's visible sections.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /bindings/python
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/bindings/node, /bindings/wasm]
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }
