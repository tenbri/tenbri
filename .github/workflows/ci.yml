# Every pull request and every push to main, so main always builds, passes and can be released:
# - check: rustfmt, clippy with warnings as errors, rustdoc with warnings as errors;
# - test: cargo nextest on Linux, macOS and Windows, the platforms the CLI ships for;
# - msrv: build and test on the pinned minimum Rust (Cargo.toml's rust-version, 1.85);
# - deny and audit: licenses, advisories, duplicate and banned crates (deny.toml), and RustSec;
# - semver: cargo-semver-checks against the last release on crates.io;
# - storage: the store, writer and CLI against MinIO, the object store anyone can run, as
#   Artbucket's CI runs Postgres;
# - python, node, wasm: each binding builds as release.yml builds it and passes its own tests
#   (pytest and mypy; tsc and node:test; wasm-pack test and the built package in Node), the
#   vectors among them; the WASM verifier stays within its size budget;
# - adapter-claude-agent-sdk: the Claude Agent SDK adapter, Python and TypeScript, against the SDK's
#   current and previous release;
# - adapter-langgraph: the LangGraph and LangChain adapter, Python and TypeScript, against the
#   frameworks' current and previous release;
# - contract: tenbrid's OpenAPI and protobuf files hold against the base branch, as Artbucket
#   holds its v1 contract.
# The test job also runs the conformance vectors (spec/vectors/) through tenbri-core, tenbri-merkle
# and the local store, the tamper property tests and the writer crash tests. R2 and S3 run nightly
# (nightly.yml).
# Still to come, with the code they test: fuzz targets (60 seconds here, long runs nightly).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The Python binding's tests link libpython; setup-python's builds ship it on every OS.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked
      # nextest runs no doctests.
      - run: cargo test --workspace --doc --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      # --locked: Cargo.lock is resolved for rust-version (resolver 3), so this tests what users get.
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nothing is on crates.io before 0.1.0-alpha.1, so there is no baseline to compare with.
    # ponytail: allowed to fail until then; delete this line once alpha.1 is published.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # A crate with no release on crates.io has no baseline: check the ones that have one.
      - name: Crates on crates.io
        id: published
        run: |
          packages=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish != []) | .name' \
            | while read -r c; do
                curl -sf -o /dev/null -A "tenbri CI (github.com/tenbri/tenbri)" \
                  "https://crates.io/api/v1/crates/$c" && echo "$c"
              done | paste -sd, -)
          echo "Checking: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: ${{ steps.published.outputs.packages }}

  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENBRI_TEST_S3_ENDPOINT: http://localhost:9000
      TENBRI_TEST_S3_REGION: us-east-1
      TENBRI_TEST_S3_BUCKET: tenbri
      TENBRI_TEST_S3_ACCESS_KEY_ID: tenbri
      TENBRI_TEST_S3_SECRET_ACCESS_KEY: tenbri-ci-only
    steps:
      - uses: actions/checkout@v7
      # MinIO, not a services: entry, because a service container can't be given its command
      # (server /data). MinIO no longer publishes images; Chainguard builds it from source.
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$TENBRI_TEST_S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$TENBRI_TEST_S3_SECRET_ACCESS_KEY" \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 30); do curl -sf -o /dev/null http://localhost:9000/minio/health/ready && break; sleep 1; done
          # The bucket, with a signed S3 CreateBucket (curl signs SigV4 itself).
          curl -sf --aws-sigv4 "aws:amz:$TENBRI_TEST_S3_REGION:s3" \
            --user "$TENBRI_TEST_S3_ACCESS_KEY_ID:$TENBRI_TEST_S3_SECRET_ACCESS_KEY" \
            -X PUT "$TENBRI_TEST_S3_ENDPOINT/$TENBRI_TEST_S3_BUCKET" || { docker logs minio; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The conformance suite, the crash and race tests on local disk, in memory and on MinIO (the
      # canary included), and the CLI round trip on MinIO.
      - run: cargo nextest run -p tenbri-store -p tenbri-writer -p tenbri-cli --all-features --locked
      - name: The suite ran on MinIO
        run: |
          curl -sf --aws-sigv4 "aws:amz:$TENBRI_TEST_S3_REGION:s3" \
            --user "$TENBRI_TEST_S3_ACCESS_KEY_ID:$TENBRI_TEST_S3_SECRET_ACCESS_KEY" \
            "$TENBRI_TEST_S3_ENDPOINT/$TENBRI_TEST_S3_BUCKET?list-type=2&prefix=tenbri-tests/&max-keys=1" | grep -q '<Key>'

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10" # the oldest the abi3 wheel promises
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install ./bindings/python pytest mypy
      - run: python -m pytest bindings/python/tests
      - run: python -m mypy --strict bindings/python/python/tenbri

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx napi build --platform
      - name: The committed loader and types match the code
        run: |
          if ! git diff --exit-code -- index.js index.d.ts; then
            echo "::error::index.js or index.d.ts is out of date. Run npx napi build --platform in bindings/node and commit them."
            exit 1
          fi
      - run: npm test

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # The core and the Merkle crate do no I/O, so they build for the browser unchanged.
      - run: cargo build -p tenbri-core -p tenbri-merkle --target wasm32-unknown-unknown --locked
      - run: wasm-pack build --release --target web --out-dir pkg --no-pack
        working-directory: bindings/wasm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The conformance vectors inside WebAssembly, then the package as npm ships it.
      - run: wasm-pack test --node
        working-directory: bindings/wasm
      - run: npm test
        working-directory: bindings/wasm
      - name: The verifier stays small
        working-directory: bindings/wasm
        run: |
          size=$(gzip -9 < pkg/tenbri_wasm_bg.wasm | wc -c)
          echo "tenbri_wasm_bg.wasm: $size bytes gzipped"
          if [ "$size" -gt 200000 ]; then
            echo "::error::the WASM verifier is $size bytes gzipped, over its 200,000-byte budget"
            exit 1
          fi

  # tenbrid's API is a frozen contract per major version: nothing a client of the base branch
  # relies on may change. contract/ holds openapi.v1.yaml and proto/. That they match tenbrid is
  # tested in the test job (crates/tenbri-server/tests/contract.rs: the OpenAPI document is generated
  # from the REST handlers, the gRPC code from the proto); here they are linted and held against the
  # base branch, which passes while the base branch has none.
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: OpenAPI loads, and holds against the base branch
        run: |
          oasdiff() { docker run --rm -v "$RUNNER_TEMP:/base" -v "$PWD/contract:/head" tufin/oasdiff "$@"; }
          # The branch's own document must load (a dangling $ref does not), base or no base.
          oasdiff breaking /head/openapi.v1.yaml /head/openapi.v1.yaml --fail-on ERR
          if ! git cat-file -e "origin/$BASE:contract/openapi.v1.yaml" 2>/dev/null; then
            echo "No contract/openapi.v1.yaml on $BASE yet: nothing to hold."
            exit 0
          fi
          git show "origin/$BASE:contract/openapi.v1.yaml" > "$RUNNER_TEMP/base.yaml"
          # A base that does not load holds nothing; it must not block every pull request.
          if ! oasdiff breaking /base/base.yaml /base/base.yaml > /dev/null 2>&1; then
            echo "::warning::$BASE's contract/openapi.v1.yaml does not load, so nothing is compared. Fix it on $BASE."
            exit 0
          fi
          oasdiff breaking /base/base.yaml /head/openapi.v1.yaml --fail-on ERR
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Protobuf lint
        run: buf lint contract/proto
      - name: Protobuf holds against the base branch
        run: |
          if ! git cat-file -e "origin/$BASE:contract/proto" 2>/dev/null; then
            echo "No contract/proto on $BASE yet: nothing to hold."
            exit 0
          fi
          buf breaking contract/proto --against ".git#branch=origin/$BASE,subdir=contract/proto"

  # The Claude Agent SDK adapter (adapters/claude-agent-sdk) in Python and TypeScript, against each
  # SDK's current release and the last release of its previous minor (bump those pins when a new
  # minor ships). The SDKs drive testing/fake-claude.mjs, a stand-in for the Claude Code CLI: no
  # model, no API key.
  adapter-claude-agent-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIOUS_PY: "0.1.81"
      PREVIOUS_TS: "0.2.141"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bindings/node/package-lock.json
            adapters/claude-agent-sdk/typescript/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Python
        working-directory: adapters/claude-agent-sdk/python
        run: |
          python -m pip install ../../../bindings/python . pytest mypy opentelemetry-api
          python -m pytest tests
          python -m mypy --strict src tests examples
          python -m pip install "claude-agent-sdk==$PREVIOUS_PY"
          python -m pytest tests
          python -m mypy --strict src tests examples
      - name: Node binding
        working-directory: bindings/node
        run: npm ci && npx napi build --platform
      - name: TypeScript
        working-directory: adapters/claude-agent-sdk/typescript
        run: |
          npm ci
          npm test
          npm install --no-save "@anthropic-ai/claude-agent-sdk@$PREVIOUS_TS"
          npm test

  # The OpenAI Agents SDK adapter (adapters/openai-agents), in Python and TypeScript, against the
  # SDK's current and previous minor release (the PRD's adapter conformance): the conformance
  # scenario and the rest with a scripted model, so no API key; types; the example end to end.
  adapter-openai-agents:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: python, sdk: "openai-agents==0.24.*" }
          - { lang: python, sdk: "openai-agents==0.23.*" }
          - { lang: typescript, sdk: "@openai/agents-core@0.20" }
          - { lang: typescript, sdk: "@openai/agents-core@0.19" }
    name: adapter-openai-agents (${{ matrix.lang }}, ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SDK: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: adapter-${{ matrix.lang }}
      - if: matrix.lang == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - if: matrix.lang == 'python'
        run: |
          python -m pip install ./bindings/python ./adapters/openai-agents/python "$SDK" pytest mypy
          python -m pytest adapters/openai-agents/python/tests
          python -m mypy --strict adapters/openai-agents/python/tenbri_openai_agents
          python adapters/openai-agents/python/examples/refunds.py "$RUNNER_TEMP/audit"
      - if: matrix.lang == 'typescript'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bindings/node/package-lock.json
            adapters/openai-agents/typescript/package-lock.json
      - if: matrix.lang == 'typescript'
        working-directory: bindings/node
        run: npm ci && npx napi build --platform
      - if: matrix.lang == 'typescript'
        working-directory: adapters/openai-agents/typescript
        run: |
          npm ci
          npm install --no-save "$SDK"
          npm test
          npm run build
          node examples/refunds.ts "$RUNNER_TEMP/audit"

  # The LangGraph and LangChain adapter (adapters/langgraph) in Python and TypeScript, with a fake
  # chat model (no API key), against the frameworks' current releases and the last release of each
  # one's previous minor (bump those pins when a new minor ships), then the examples.
  adapter-langgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIOUS_PY: langchain~=1.3.0 langchain-core~=1.5.0
      PREVIOUS_TS: langchain@~1.4.0 @langchain/langgraph@~1.4.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bindings/node/package-lock.json
            adapters/langgraph/typescript/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Python
        working-directory: adapters/langgraph/python
        run: |
          python -m pip install ../../../bindings/python . langchain opentelemetry-sdk pytest mypy
          python -m pytest tests
          python -m mypy --strict src
          python examples/refund_agent.py
          python -m pip install $PREVIOUS_PY
          python -m pytest tests
      - name: Node binding
        working-directory: bindings/node
        run: npm ci && npx napi build --platform
      - name: TypeScript
        working-directory: adapters/langgraph/typescript
        run: |
          npm ci
          npm test
          npm run example
          npm install --no-save $PREVIOUS_TS
          npm test
