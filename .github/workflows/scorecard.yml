# OpenSSF Scorecard: how the repository's own practices look to someone deciding whether to depend
# on it (branch protection, pinned actions, token permissions, signed releases, a security policy).
# Weekly and on each push to main; results in the Security tab and at
# https://scorecard.dev/viewer/?uri=github.com/tenbri/tenbri, for a README badge.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
