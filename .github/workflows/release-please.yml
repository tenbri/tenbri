# Releases without bumping versions by hand. Each push to main updates one pull request,
# "chore: release x.y.z", that collects the Conventional Commits since the last release: the next
# version, CHANGELOG.md, the [workspace.package] version every crate inherits, the workspace's own
# entries in Cargo.lock (those with no source), and bindings/wasm/package.json. It is release-type
# simple with TOML extra-files, not rust with the cargo-workspace plugin: those only know a version
# written in each crate's [package] and reject version.workspace = true. The Python package reads its version from Cargo (maturin) and the npm
# packages get theirs from napi version in release.yml. Merging it tags vX.Y.Z and publishes the
# GitHub release, then release.yml publishes everything from that tag.
#
# Until 0.1.0 every release is a pre-release (versioning: prerelease in release-please-config.json);
# each stage (alpha.1, beta.1, rc.1, 0.1.0) is moved by a one-time Release-As: footer, never by a
# value left in the config (CONTRIBUTING.md#releases).
#
# Release Please works with the RELEASE_PLEASE_TOKEN secret, a maintainer's fine-grained token
# (CONTRIBUTING.md#releases), so the release pull request gets CI and pr.yml like any other; the
# default token starts no workflows. Publishing always goes through the call to release.yml below,
# never the tag's own push, since the registries' trusted publishers name this file.
# crates.io and PyPI trusted publishers name this file as the workflow, and the release environment.
# To publish a release again (a failed run, say), run this workflow by hand with its tag: it skips
# Release Please and calls release.yml from here, so the registries still see this file.
name: Release please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Publish this existing tag again, such as v0.1.0-alpha.1 (leave empty to run Release Please)
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() && (inputs.tag != '' ||
      needs.release-please.outputs.released == 'true')
    permissions:
      contents: write # binaries, SHA256SUMS, the SBOM and licenses go on the GitHub release
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag || needs.release-please.outputs.tag }}
    secrets: inherit

  # PyPI's trusted publishing matches the workflow that runs the upload and refuses one made from a
  # called workflow (docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github),
  # so release.yml builds the wheels and the sdist, and this job uploads them from this file.
  pypi:
    needs: publish
    if: always() && needs.publish.result != 'skipped' && needs.publish.result != 'cancelled' && needs.publish.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      # With no PYPI_API_TOKEN, the action uses the trusted publisher. A version PyPI already has
      # is skipped, so a failed run can be repeated.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
