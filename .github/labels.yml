# Every label the repository uses, kept here and synced by .github/workflows/labels.yml.
# Labels made by hand and missing here stay (skip-delete): add them here to keep them.
# Dependabot's (dependencies, rust, python, javascript, github_actions) and release-please's
# (autorelease: pending, autorelease: tagged) are listed so they keep their colors.

# What it is. The issue templates set bug and enhancement.
- name: bug
  color: "d73a4a"
  description: Behaves differently from how it is documented
- name: enhancement
  color: "a2eeef"
  description: Something new, or something better
- name: documentation
  color: "0075ca"
  description: Docs, README, decisions
- name: security
  color: "b60205"
  description: A hardening change (report vulnerabilities privately, see SECURITY.md)
- name: breaking
  color: "000000"
  description: Breaks a 0.x API (a feat!) or tenbrid's API contract
- name: format
  color: "5319e7"
  description: Changes the log format or the spec (needs a new format version and test vectors)
- name: experimental
  color: "fef2c0"
  description: Behind a Cargo feature or an experimental module; may change in any minor
- name: dependencies
  color: "0366d6"
  description: Dependabot
- name: rust
  color: "dea584"
  description: Dependabot, Cargo
- name: python
  color: "3572a5"
  description: Dependabot, pip
- name: javascript
  color: "f1e05a"
  description: Dependabot, npm
- name: github_actions
  color: "000000"
  description: Dependabot, GitHub Actions

# Where it is. Pull requests get these from the files they touch (.github/labeler.yml).
