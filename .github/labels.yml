- name: "area: store"
  color: "c5def5"
  description: Local disk and object stores
- name: "area: crypt"
  color: "c5def5"
  description: Blob encryption, per-subject keys, erasure
- name: "area: index"
  color: "c5def5"
  description: The derived index: SQLite, Parquet, Iceberg
- name: "area: anchor"
  color: "c5def5"
  description: RFC 3161 timestamps, Rekor, witnesses
- name: "area: export"
  color: "c5def5"
  description: OpenLineage, W3C PROV, streaming out
- name: "area: macros"
  color: "c5def5"
  description: The #[tenbri::decision] macro
- name: "area: cli"
  color: "c5def5"
  description: The tenbri CLI, tenbrid and the container
- name: "area: mcp"
  color: "c5def5"
  description: The read-only MCP server
- name: "area: proxy"
  color: "c5def5"
  description: The MCP proxy
- name: "area: otlp"
  color: "c5def5"
  description: OpenTelemetry ingest and correlation
- name: "area: python"
  color: "c5def5"
  description: The Python package
- name: "area: node"
  color: "c5def5"
  description: The npm package
- name: "area: wasm"
  color: "c5def5"
  description: The WASM verifier
- name: "area: adapters"
  color: "c5def5"
