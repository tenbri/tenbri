[package]
name = "tenbri-crypt"
description = "Tenbri blob encryption, per-subject data and digest keys, and erasure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tenbri-core.workspace = true
tenbri-keys.workspace = true
tenbri-store.workspace = true
zeroize = "1"

[dev-dependencies]
tenbri-merkle.workspace = true
tenbri-writer.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
