[package]
name = "tenbri-cli"
description = "The tenbri command-line tool for Tenbri, the open-source Agent Decision Record."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "tenbri"
path = "src/main.rs"
# The facade crate is also called tenbri: one page in cargo doc, not two.
doc = false

[features]
# The CLI ships with every Stable feature.
default = ["keychain", "s3"]
keychain = ["tenbri-keys/keychain"]
# Streams in AWS S3, Cloudflare R2 and MinIO (s3:// and r2:// locations).
s3 = ["tenbri-store/s3"]
# Witness cosignatures (Experimental): receipt verify --witness.
witness = ["tenbri-merkle/witness", "tenbri-writer/witness"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = "1"
serde_json = "1"
tenbri-anchor = { workspace = true, features = ["client"] }
tenbri-core.workspace = true
tenbri-crypt.workspace = true
tenbri-index.workspace = true
tenbri-keys.workspace = true
tenbri-merkle.workspace = true
tenbri-schema.workspace = true
tenbri-store.workspace = true
tenbri-writer.workspace = true
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
# Not published: only the test of pins recorded by the SDKs' stream creation uses it.
tenbri-bindings = { path = "../../bindings/common" }
tenbri-anchor = { workspace = true, features = ["test-tsa", "test-witness"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
