[package]
name = "tenbri-server"
description = "tenbrid: the Tenbri REST and gRPC API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "tenbrid"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_urlencoded = "0.7"
sha2 = "0.11"
tenbri-anchor = { workspace = true, features = ["client"] }
tenbri-core.workspace = true
tenbri-index.workspace = true
tenbri-otlp.workspace = true
tenbri-keys.workspace = true
tenbri-merkle.workspace = true
tenbri-schema.workspace = true
tenbri-store = { workspace = true, features = ["s3"] }
tenbri-writer.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server"] }
tonic-health = { version = "0.14", default-features = false }
tonic-prost = "0.14"
utoipa = { version = "5", features = ["yaml"] }

[dev-dependencies]
# tests/contract.rs: src/proto.rs is generated from contract/proto and checked against it.
protox = "0.9"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
tenbri-index.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tenbri-anchor = { workspace = true, features = ["test-tsa"] }
tonic = { version = "0.14", default-features = false, features = ["channel"] }

[lints]
workspace = true
