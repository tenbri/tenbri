[package]
name = "tenbri-testkit"
description = "Tenbri test kit: in-memory stream, fixed clock and keys, assertions and snapshots for testing agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tenbri-core.workspace = true
tenbri-keys.workspace = true
tenbri-store.workspace = true
tenbri-writer.workspace = true

[dev-dependencies]
# tests/otel.rs: trace ids from a span into entries and back, and the spans Tenbri emits.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }
tenbri-writer = { workspace = true, features = ["otel"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
