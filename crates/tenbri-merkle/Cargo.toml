[package]
name = "tenbri-merkle"
description = "RFC 6962 Merkle tree, inclusion and consistency proofs, C2SP checkpoints for Tenbri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# Witness cosignatures (Experimental): the checkpoint key, C2SP cosignatures, tlog-witness requests.
witness = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }
sha2 = "0.11"
tenbri-core.workspace = true

[dev-dependencies]
proptest = "1"
serde_json = "1"

[[example]]
name = "witness-vectors"
required-features = ["witness"]
