[package]
name = "tenbri-anchor"
description = "Tenbri checkpoint anchoring: RFC 3161 timestamp tokens and Sigstore Rekor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# Asking a timestamp authority over HTTP. Verifying needs no network and builds for wasm32.
client = ["dep:getrandom", "dep:reqwest"]
# A timestamp authority in memory, for tests and the receipt test vectors: never for production.
test-tsa = ["x509-cert/builder", "p256/pem", "dep:tokio"]
# Witness cosignatures (Experimental): submitting checkpoints to C2SP witnesses over HTTP.
witness = ["client", "tenbri-merkle/witness"]
# A C2SP witness in memory, for tests: never for production.
test-witness = ["tenbri-merkle/witness", "dep:tokio"]

[dependencies]
cms = "0.2.3"
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
getrandom = { version = "0.4", optional = true }
p256 = { version = "0.13", default-features = false, features = ["alloc", "ecdsa", "pkcs8"] }
p384 = { version = "0.13", default-features = false, features = ["alloc", "ecdsa", "pkcs8"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
# No `std`: it pulls getrandom through rand_core, and verifying needs no randomness (wasm32).
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
sha1 = "0.10"
sha2 = { version = "0.11", features = ["oid"] }
tenbri-core.workspace = true
tenbri-merkle.workspace = true
x509-cert = { version = "0.2.5", default-features = false, features = ["pem", "std"] }
x509-tsp = "0.1"
tokio = { version = "1", features = ["io-util", "net", "rt"], optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[[example]]
name = "receipt-vectors"
required-features = ["test-tsa"]

[[test]]
name = "tsa"
required-features = ["client", "test-tsa"]
