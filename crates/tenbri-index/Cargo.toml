[package]
name = "tenbri-index"
description = "Tenbri derived index (SQLite, Parquet, Iceberg): rebuild, query, as-of."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tenbri-core.workspace = true
tenbri-merkle.workspace = true
tenbri-store.workspace = true
tenbri-writer.workspace = true

[dev-dependencies]
proptest = "1"
tenbri-crypt.workspace = true
tenbri-keys.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
