[package]
name = "tenbri-writer"
description = "Tenbri batching, write protocol, HEAD, checkpoints and reconciliation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# Puts the active OpenTelemetry span's ids on every entry appended without `trace`, and emits
# spans and metrics for appends and verifies through the OpenTelemetry API (tenbri-otlp). Sends
# nothing unless the application installs an exporter.
otel = ["dep:tenbri-otlp", "tenbri-otlp/otel"]

[dependencies]
getrandom = "0.4"
serde_json = "1"
tenbri-core.workspace = true
tenbri-keys.workspace = true
tenbri-merkle.workspace = true
tenbri-otlp = { workspace = true, optional = true }
tenbri-store.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
# tests/external.rs: a stream key kept by an external signer (a double of an HSM).
tenbri-keys = { workspace = true, features = ["external"] }
tenbri-store = { workspace = true, features = ["s3"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
