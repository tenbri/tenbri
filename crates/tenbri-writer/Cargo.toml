[package]
name = "tenbri-writer"
description = "Tenbri batching, write protocol, HEAD, checkpoints and reconciliation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = "0.4"
serde_json = "1"
tenbri-core.workspace = true
tenbri-keys.workspace = true
tenbri-store.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tenbri-store = { workspace = true, features = ["s3"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
