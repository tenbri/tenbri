[package]
name = "tenbri-keys"
description = "Tenbri stream keys, session-key certificates, rotation and revocation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# Secrets in the OS keychain: macOS Keychain and Windows Credential Manager. The Linux Secret
# Service needs keyring 4 (Rust 1.88, above the MSRV); until then it is refused, never mocked.
keychain = ["dep:keyring"]

[dependencies]
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tenbri-core.workspace = true
zeroize = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native"] }
