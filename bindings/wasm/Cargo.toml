[package]
name = "tenbri-wasm"
description = "The Tenbri verifier for browsers, compiled to WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Ships as @tenbri/wasm on npm, not as a crate.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

# Rust turns on bulk memory and other post-MVP features by default (1.87+); wasm-opt, which
# wasm-pack runs, has to be told, or it rejects the module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]
