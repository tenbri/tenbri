[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[project]
name = "tenbri"
description = "The open-source Agent Decision Record: every decision signed, chained and provable."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# The version is the Cargo workspace's, read by maturin: Release Please moves it there only.
dynamic = ["version"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/tenbri/tenbri"

[tool.maturin]
# The API is Python (python/tenbri); the Rust core is its tenbri._native extension.
python-source = "python"
module-name = "tenbri._native"
features = ["pyo3/extension-module"]
