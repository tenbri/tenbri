[package]
name = "tenbri-bindings"
description = "What the Tenbri Python and Node packages share: a stream to write, verify and query."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Compiled into the tenbri wheel and the tenbri npm package, not published.
publish = false

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tenbri-core.workspace = true
tenbri-crypt.workspace = true
tenbri-keys.workspace = true
# checkpoint::base64, for the digest route's content.
tenbri-merkle.workspace = true
tenbri-schema.workspace = true
tenbri-store = { workspace = true, features = ["s3"] }
tenbri-writer.workspace = true
url = "2"

[dev-dependencies]
# tests/remote.rs: a stream written through a tenbrid in the test process.
tenbri-server = { path = "../../crates/tenbri-server" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
