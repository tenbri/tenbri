# cargo-deny (ci.yml's deny job): licenses, advisories, duplicate and banned crates, sources.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported for the whole graph; yanked versions fail.
yanked = "deny"
ignore = [
  # Marvin: timing leaks in RSA decryption and signing with a private key. tenbri-anchor only
  # verifies RSA signatures of timestamp authorities, with public keys; no fixed rsa release yet.
  # Keep in step with .cargo/audit.toml.
  { id = "RUSTSEC-2023-0071", reason = "rsa is used only to verify signatures (tenbri-anchor)" },
]

[licenses]
# Permissive licenses Apache-2.0 can carry. A new one is a decision: add it here in the pull
# request that brings it in, and to about.toml.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace's own crates are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
